name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21
      - run: ./gradlew test jar --no-daemon
      - name: Runs on Java 11
        run: |
          cat > Main.java <<'J'
          public class Main { public static void main(String[] a) { com.codeskop.server.Codeskop.init(com.codeskop.server.Codeskop.options().apiKey("cs_test_pk_abcdefgh12345678").endpoint("http://127.0.0.1:9")); System.out.println(com.codeskop.server.Events.templateRoute("/a/{id}")); } }
          J
          $JAVA_HOME_11_X64/bin/javac -cp build/libs/codeskop-server-0.1.0.jar Main.java
          $JAVA_HOME_11_X64/bin/java -cp build/libs/codeskop-server-0.1.0.jar:. Main
